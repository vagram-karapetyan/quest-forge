[project]
name = "text-quest"
version = "0.3.0"
description = "Веб-платформа и визуальный конструктор (Twine-like) для создания и прохождения нелинейных текстовых квестов"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "sqlmodel>=0.0.22",
    "uvicorn>=0.30.0",
]

[project.scripts]
text-quest = "text_quest:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
